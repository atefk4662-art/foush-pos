<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فؤش ابن سيد للطواجن | FOUSH POS v11.83</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0f0d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="طواجن فوش">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #fbbf24; --primary-dark: #f59e0b; --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --danger: #ef4444; --success: #10b981; --sidebar-w: 240px; --header-h: 60px; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; position: relative; }

        .foush-persistent-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('logo.png') no-repeat center 10%; background-size: contain; opacity: 0.04; z-index: -1; pointer-events: none; }
        
        header { height: var(--header-h); background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; backdrop-filter: blur(15px); }
        #app { flex: 1; display: none; grid-template-columns: var(--sidebar-w) 1fr; min-height: 0; }
        
        .sidebar { background: rgba(30,41,59,0.8); border-left: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; padding: 15px; overflow-y: auto; backdrop-filter: blur(10px); }
        .sidebar-link { padding: 12px; border-radius: 12px; color: #94a3b8; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; border: none; background: transparent; text-align: right; width: 100%; font-size: 1rem; font-weight: 700; margin-bottom: 4px; flex-shrink: 0; }
        .sidebar-link:hover, .sidebar-link.active { background: rgba(251,191,36,0.1) !important; color: var(--primary) !important; box-shadow: inset -4px 0 0 var(--primary); }
        
        .main-content { flex: 1; padding: 12px; display: flex; flex-direction: column; min-height: 0; position: relative; }
        .page-container { flex: 1; display: none; min-height: 0; z-index: 1; overflow: hidden; }
        .page-container.active { display: flex; flex-direction: column; }
        
        .pos-layout { display: grid; grid-template-columns: 1fr 350px; gap: 12px; height: 100%; min-height: 0; }
        .items-side { display: flex; flex-direction: column; gap: 8px; min-height: 0; position: relative; }
        .items-side::before { content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 600px; height: 600px; background: url('logo.png') no-repeat center 20%; background-size: contain; opacity: 0.05; pointer-events: none; z-index: -1; }

        .items-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; align-content: start; }
        .cart-side { background: rgba(30,41,59,0.7); border-radius: 20px; display: flex; flex-direction: column; padding: 15px; min-height: 0; border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(5px); }
        .cart-items { flex: 1; overflow-y: auto; margin-bottom: 10px; }
        
        .pos-card { background: rgba(255,255,255,0.02); border-radius: 15px; padding: 12px; text-align: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); transition: 0.2s; position: relative; }
        .pos-card:hover { border-color: var(--primary); background: rgba(255,255,255,0.05); transform: translateY(-3px); }
        .pos-card.out-of-stock { opacity: 0.5; filter: grayscale(1); pointer-events: none; }
        .pos-card.low-stock { border-color: var(--danger); box-shadow: 0 0 10px rgba(239,68,68,0.2); }

        .btn-luxury { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #000; border: none; padding: 10px; border-radius: 12px; font-weight: 900; cursor: pointer; font-size: 1rem; width: 100%; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .btn-luxury:hover { filter: brightness(1.2); transform: translateY(-2px); }
        .btn-luxury.danger { background: var(--danger); color: #fff; }
        
        #role-screen { background: #000; display: flex; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100000; overflow: hidden; padding: 20px; }
        .role-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('logo.png') no-repeat center 10%; background-size: cover; opacity: 0.22; z-index: 0; filter: blur(1px); }
        .role-grad { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(15,23,42,0.1) 0%, rgba(15,23,42,1) 85%); z-index: 1; }
        .role-content { position: relative; z-index: 2; text-align: center; width: 100%; max-width: 600px; }
        .role-logo-main { width: 180px; height: 180px; margin: 0 auto 20px; background: url('logo.png') no-repeat center center; background-size: contain; filter: drop-shadow(0 0 20px var(--primary)); border: 4px solid var(--primary); border-radius: 50%; box-shadow: 0 0 40px rgba(251,191,36,0.4); animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .modal-body { width: 450px; background: var(--panel); color: var(--text); border-radius: 25px; padding: 25px; max-height: 90vh; display: flex; flex-direction: column; border: 2px solid var(--primary); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        .input-luxury { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 12px; color: #fff; width: 100%; outline: none; margin-bottom: 12px; font-size: 1rem; }
        
        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--primary); color: #000; padding: 12px 25px; border-radius: 12px; font-weight: 900; z-index: 200000; display: none; box-shadow: 0 10px 30px rgba(251,191,36,0.3); }
        
        .badge { padding: 3px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 900; }
        .badge-preparing { background: rgba(251,191,36,0.1); color: var(--primary); }
        .badge-ready { background: rgba(16,185,129,0.1); color: var(--success); }
        
        .order-card, .inv-card { background: rgba(255,255,255,0.02); border-radius: 15px; padding: 12px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.05); transition: 0.2s; position: relative; }
        .table-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; padding: 8px; background: rgba(0,0,0,0.2); border-radius: 12px; margin-bottom: 10px; }
        .table-btn { padding: 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: #fff; cursor: pointer; text-align: center; font-size: 0.85rem; font-weight: 700; transition: 0.2s; }
        .table-btn.active { border-color: var(--primary); background: rgba(251,191,36,0.1); color: var(--primary); }
        .table-btn.busy { border-color: var(--danger); color: var(--danger); background: rgba(239,68,68,0.2); animation: pulse-red 2s infinite; }
        .table-btn.billing { border-color: #a855f7; color: #a855f7; animation: pulse-purple 1.5s infinite; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); } 70% { box-shadow: 0 0 0 10px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }
        @keyframes pulse-purple { 0% { box-shadow: 0 0 0 0 rgba(168,85,247,0.7); } 70% { box-shadow: 0 0 0 15px rgba(168,85,247,0); } 100% { box-shadow: 0 0 0 0 rgba(168,85,247,0); } }
        
        .stat-card { background: rgba(255,255,255,0.03); border-radius: 15px; padding: 15px; flex: 1; text-align: center; border-bottom: 2px solid var(--primary); cursor: pointer; transition: 0.2s; }
        .stat-card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.05); }
        
        .foush-table { width: 100%; border-collapse: collapse; }
        .foush-table th { background: rgba(255,255,255,0.03); padding: 12px; text-align: right; color: var(--primary); font-size: 0.9rem; border-bottom: 1px solid var(--primary); }
        .foush-table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 0.95rem; font-weight: 700; }

        .order-timer-premium { background: rgba(0,0,0,0.2); padding: 3px 8px; border-radius: 15px; font-family: 'Orbitron'; font-size: 0.8rem; display: flex; align-items: center; gap: 4px; }
        .timer-dot { width: 6px; height: 6px; border-radius: 50%; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
        .hide-scroll::-webkit-scrollbar { display: none; }

        /* Mobile Navigation Bar */
        .mobile-nav { display: none; }
        .mobile-menu-modal { display: none; }
        .pos-mobile-tabs { display: none; }
        
        .kitchen-layout-grid { display: grid; grid-template-columns: 200px 1fr 1fr 1fr; gap: 15px; height: 100%; }
        .dashboard-columns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

        @media (max-width: 900px) {
            #app { grid-template-columns: 1fr !important; }
            .sidebar { display: none; }
            .main-content { padding: 8px !important; padding-bottom: 75px !important; }
            header { padding: 0 10px; }
            header h2 { font-size: 1.1rem !important; letter-spacing: 1px !important; }
            #clock { font-size: 1.2rem !important; }
            #timer { font-size: 0.75rem !important; padding: 2px 6px !important; }
            
            /* Bottom Nav Bar Styles */
            .mobile-nav { display: flex; position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px); border-top: 1px solid rgba(255, 255, 255, 0.08); z-index: 9999; justify-content: space-around; align-items: center; padding: 5px 0; }
            .mobile-nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8; font-size: 0.7rem; border: none; background: transparent; cursor: pointer; flex: 1; transition: 0.2s; gap: 4px; font-weight: 700; height: 100%; }
            .mobile-nav-btn i { font-size: 1.2rem; }
            .mobile-nav-btn.active { color: var(--primary) !important; }
            
            /* Modals Responsiveness */
            .modal-body { width: 95% !important; max-width: 450px !important; padding: 15px !important; border-radius: 15px !important; }
            
            /* POS Mobile Tabs */
            .pos-mobile-tabs { display: flex; width: 100%; gap: 10px; margin-bottom: 10px; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 12px; }
            .pos-tab-btn { flex: 1; padding: 10px; border-radius: 10px; border: none; background: transparent; color: #fff; font-weight: 700; cursor: pointer; transition: 0.2s; position: relative; }
            .pos-tab-btn.active { background: var(--primary); color: #000; }
            .cart-badge-count { position: absolute; top: -5px; right: -5px; background: var(--danger); color: #fff; font-size: 0.7rem; font-weight: 900; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
            
            /* POS Mobile Layout Toggle */
            .pos-layout { grid-template-columns: 1fr !important; height: auto !important; min-height: 0 !important; }
            .items-side { height: auto !important; min-height: 0 !important; }
            .items-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)) !important; }
            
            .pos-layout.show-items .cart-side { display: none !important; }
            .pos-layout.show-items .items-side { display: flex !important; }
            .pos-layout.show-cart .items-side { display: none !important; }
            .pos-layout.show-cart .cart-side { display: flex !important; width: 100% !important; min-height: auto !important; height: 100% !important; }
            
            /* Stat Cards on Dashboard */
            .stat-card { padding: 10px !important; font-size: 0.9rem !important; }
            .stat-card h2 { font-size: 1.2rem !important; }
            
            /* Tables Grid */
            .table-grid { grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)) !important; }
            .table-btn { font-size: 0.75rem !important; padding: 6px !important; }
            
            /* Kitchen Grid & Columns */
            .kitchen-layout-grid { grid-template-columns: 1fr !important; height: auto !important; overflow-y: auto !important; }
            
            /* Dashboard Columns */
            .dashboard-columns { grid-template-columns: 1fr !important; }
            
            /* Table Edit & Modal Details */
            #drilldown-modal .modal-body { width: 95% !important; max-height: 80vh !important; }
            .foush-table th, .foush-table td { padding: 8px !important; font-size: 0.8rem !important; }
        }

        /* Tablets Fluid & Adaptive Screen Optimization */
        @media (min-width: 901px) and (max-width: 1200px) {
            :root { --sidebar-w: 75px !important; }
            .sidebar { padding: 15px 5px !important; align-items: center; }
            .sidebar-link { justify-content: center; gap: 0; padding: 12px 5px !important; }
            .sidebar-link i { font-size: 1.3rem; margin: 0; }
            .sidebar-label { display: none; }
            
            /* Fluid adjustments for POS on Tablet */
            .pos-layout { grid-template-columns: 1fr 310px !important; gap: 10px !important; }
            .cart-side { padding: 12px !important; }
            .items-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)) !important; }
            
            /* Fluid Kitchen grid for Tablet */
            .kitchen-layout-grid { grid-template-columns: 1fr 1fr !important; height: auto !important; overflow-y: auto !important; }
            .kitchen-layout-grid .cart-side { height: 400px !important; }
        }

        @media (max-width: 600px) {
            #role-screen h1 { font-size: 2.2rem !important; }
            #role-screen p { font-size: 1.1rem !important; margin-bottom: 20px !important; }
            .role-logo-main { width: 120px !important; height: 120px !important; }
            .role-content button { padding: 14px !important; font-size: 0.95rem !important; }
        }

        @media print { 
            body > *:not(#print-area) { display: none !important; } 
            #print-area { display: block !important; width: 80mm; background: #fff !important; color: #000 !important; font-family: 'Cairo', sans-serif !important; padding: 5mm; margin: 0; } 
            #print-area * { color: #000 !important; }
        }
    </style>
</head>
<body>

<div class="foush-persistent-bg"></div>
<div id="toast"></div>
<div id="print-area" style="display:none;"></div>

<div id="role-screen">
    <div class="role-bg"></div>
    <div class="role-grad"></div>
    <div class="role-content">
        <div class="role-logo-main"></div>
        <h1 style="font-size:3.5rem; color:var(--primary); font-weight:900; line-height:1; margin-bottom:10px; text-shadow: 0 4px 20px rgba(0,0,0,0.8);">فؤش ابن سيد</h1>
        <p style="font-size:1.6rem; margin-bottom:40px; font-weight:700; color:var(--text); opacity:0.9;">مملكة الطواجن الرقمية 🥘</p>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; max-width:480px; margin:0 auto;">
            <button onclick="window.login('manager')" class="btn-luxury" style="padding:22px; font-size:1.1rem;">المدير👑</button>
            <button onclick="window.login('cashier')" class="btn-luxury" style="padding:22px; font-size:1.1rem;">الكاشير💰</button>
            <button onclick="window.login('waiter')" class="btn-luxury" style="padding:22px; font-size:1.1rem;">الويتر🤵</button>
            <button onclick="window.login('kitchen')" class="btn-luxury" style="padding:22px; font-size:1.1rem;">المطبخ🔥</button>
        </div>
        <button onclick="document.getElementById('attendance-modal').style.display='flex'; setTimeout(()=>document.getElementById('att-pin').focus(),100);" class="btn-luxury" style="margin:20px auto 0; max-width:480px; width:100%; padding:20px; font-size:1.5rem; background:rgba(0,0,0,0.5); border:2px solid var(--primary);">بصمة الحضور والانصراف 👆</button>
    </div>
</div>

<div id="mobile-menu-modal" class="overlay" style="display:none;" onclick="if(event.target===this) this.style.display='none';">
    <div class="modal-body" style="width:320px; max-width:90%;">
        <h3 style="text-align:center; color:var(--primary); margin-bottom:15px; font-family:'Orbitron';">قائمة التحكم 🎛️</h3>
        <div id="mobile-menu-links" style="display:flex; flex-direction:column; gap:10px; overflow-y:auto; max-height:50vh;"></div>
        <button onclick="window.logout()" class="btn-luxury danger" style="margin-top:15px;"><i class="fa-solid fa-power-off"></i> خروج آمن</button>
        <button onclick="document.getElementById('mobile-menu-modal').style.display='none'" class="btn-luxury" style="margin-top:8px;">إغلاق</button>
    </div>
</div>

<div id="attendance-modal" class="overlay" style="display:none;" onkeydown="if(event.key==='Escape') this.style.display='none';">
    <div class="modal-body" style="text-align:center; width:400px;">
        <i class="fa-solid fa-fingerprint" style="font-size:3.5rem; color:var(--primary); margin-bottom:15px;"></i>
        <h2 style="margin-bottom:20px;">تسجيل البصمة 👆</h2>
        <input id="att-pin" type="password" class="input-luxury" placeholder="أدخل الكود السري (PIN)" style="text-align:center; font-size:2rem; letter-spacing:10px; margin-bottom:10px;" onkeydown="if(event.key==='Enter') window.registerAttendance()">
        <p id="att-msg" style="color:var(--danger); font-size:0.9rem; font-weight:900; margin-bottom:10px; height:20px;"></p>
        <div style="display:flex; gap:10px;">
            <button onclick="window.registerAttendance()" class="btn-luxury" style="flex:1; padding:15px; font-size:1.2rem;">تسجيل الدخول / الخروج</button>
            <button onclick="document.getElementById('attendance-modal').style.display='none';" class="btn-luxury danger" style="padding:15px; width:auto;"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </div>
</div>

<div id="shift-modal" class="overlay" style="display:none;">
    <div class="modal-body" style="text-align:center; width:400px;">
        <i class="fa-solid fa-clock-rotate-left" style="font-size:3.5rem; color:var(--primary); margin-bottom:20px;"></i>
        <h2>الوردية مغلقة</h2>
        <button onclick="window.startShift()" class="btn-luxury" style="margin-top:30px; font-size:1.8rem; padding:20px;">فتح الوردية 🔓</button>
    </div>
</div>

<div id="receipt-modal" class="overlay" style="display:none;" onkeydown="if(event.key==='Enter') window.finalizeTransaction();">
    <div class="modal-body" style="width:400px; max-height:95vh; overflow-y:auto; padding:15px;">
        <div id="receipt-customer-info" style="display:none; margin-bottom:10px;">
            <div style="display:flex; gap:8px;">
                <input id="receipt-cust-name" class="input-luxury" placeholder="الاسم (اختياري)" style="margin-bottom:0;" oninput="window.updateReceiptPreview()">
                <input id="receipt-cust-phone" class="input-luxury" placeholder="رقم التليفون" style="margin-bottom:0;" oninput="window.updateReceiptPreview()">
            </div>
        </div>
        <div id="receipt-preview" style="background:#fff; border:1px dashed #000; padding:10px; margin-bottom:10px; color:#000; border-radius:10px;" class="hide-scroll"></div>
        <div style="display:flex; gap:8px; margin-bottom:10px;">
            <select id="receipt-payment" class="input-luxury" style="margin-bottom:0;" onchange="window.updateReceiptPreview()">
                <option value="cash">كاش 💵</option>
                <option value="visa">فيزا 💳</option>
                <option value="wallet">محفظة 📱</option>
            </select>
            <input id="receipt-discount" type="number" class="input-luxury" placeholder="خصم (ج)" style="margin-bottom:0; width:100px;" oninput="window.updateReceiptPreview()">
        </div>
        <div style="display:flex; gap:8px;"><button id="receipt-confirm-btn" onclick="window.finalizeTransaction()" class="btn-luxury" style="flex:1;">طباعة وحساب ✅</button><button onclick="window.closeReceipt()" class="btn-luxury danger" style="width:auto; padding:0 20px;">إلغاء</button></div>
    </div>
</div>

<div id="drilldown-modal" class="overlay" style="display:none;">
    <div class="modal-body" style="width:500px;">
        <h2 id="drilldown-title" style="margin-bottom:20px; color:var(--primary);">التفاصيل</h2>
        <div id="drilldown-content" style="flex:1; overflow-y:auto;" class="hide-scroll"></div>
        <button onclick="document.getElementById('drilldown-modal').style.display='none'" class="btn-luxury" style="margin-top:20px;">إغلاق</button>
    </div>
</div>

<div id="inventory-modal" class="overlay" style="display:none;">
    <div class="modal-body" style="width:400px;">
        <h2 style="margin-bottom:20px;">إضافة صنف جديد</h2>
        <input id="inv-name" placeholder="اسم الصنف" class="input-luxury">
        <input id="inv-price" type="number" placeholder="السعر" class="input-luxury">
        <select id="inv-cat-select" class="input-luxury">
            <option>طواجن</option><option>أرز وفتة</option><option>شوربة</option><option>سلطات</option><option>مشروبات</option>
        </select>
        <input id="inv-stock-input" type="number" placeholder="الكمية المتاحة" class="input-luxury">
        <div style="display:flex; gap:8px;">
            <button onclick="window.saveNewItem()" class="btn-luxury" style="flex:1;">حفظ ✅</button>
            <button onclick="document.getElementById('inventory-modal').style.display='none'" class="btn-luxury danger">إلغاء</button>
        </div>
    </div>
</div>

<div id="stock-update-modal" class="overlay" style="display:none;">
    <div class="modal-body" style="width:400px;">
        <h2 style="margin-bottom:20px;">تعديل الصنف</h2>
        <label style="font-size:0.8rem; opacity:0.7;">اسم الصنف:</label>
        <input id="stock-item-name-input" class="input-luxury">
        <label style="font-size:0.8rem; opacity:0.7;">السعر (ج):</label>
        <input id="stock-item-price-input" type="number" class="input-luxury">

        <div id="menu-links" style="flex:1;"></div>

        <div id="page-pos" class="page-container active"></div><div id="page-dashboard" class="page-container"></div><div id="page-kitchen" class="page-container"></div><div id="page-inventory" class="page-container"></div><div id="page-expenses" class="page-container"></div><div id="page-tables" class="page-container"></div><div id="page-reports" class="page-container"></div><div id="page-employees" class="page-container"></div><div id="page-waiter" class="page-container"></div>
    </main>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCLUuixSAwBVGAIRqTbwC_QzwS-wknOEuc", authDomain: "tawajen-foush.firebaseapp.com", databaseURL: "https://tawajen-foush-default-rtdb.firebaseio.com", projectId: "tawajen-foush", storageBucket: "tawajen-foush.firebasestorage.app", messagingSenderId: "821143454397", appId: "1:821143454397:web:fab79978563ad46a1f2dd4", measurementId: "G-V04VKH29XW" };
    let database = null; try { if(typeof firebase!=='undefined'){firebase.initializeApp(firebaseConfig); database=firebase.database();} } catch(e){}

    const DEFAULT_MENU = [ {id:1, name:'طاجن لحم', price:250, category:'طواجن', stock:100}, {id:2, name:'أرز بالشعيرية', price:40, category:'أرز وفتة', stock:100, unlimited:true}, {id:3, name:'شوربة طواجن', price:60, category:'شوربة', stock:100} ];
    function safeGet(k, d) { try { const v=localStorage.getItem(k); return (v&&v!=='undefined')?JSON.parse(v):d; } catch(e){return d;} }

    window.state = {
        role: sessionStorage.getItem('foush_role'), page: sessionStorage.getItem('foush_last_page')||'pos',
        db: { menu: safeGet('f_menu', DEFAULT_MENU), orders: safeGet('f_orders', []), exp: safeGet('f_exp', []), shift: safeGet('f_shift', null), tables: safeGet('f_tables', []), shifts_history: safeGet('f_history', []), stock_history: safeGet('f_stock_history', []), employees: safeGet('f_employees', []), attendance: safeGet('f_attendance', []) },
        cart: [], cat: 'الكل', invCat: 'الكل', type: 'takeaway', selectedTable: 'خارجي', tempOrder: null, selectedItemId: null, editingTableId: null, custName: '', custPhone: ''
    };

    window.playSound = (type) => { try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); if(type==='kitchen-alert') { for(let i=0; i<15; i++){ const t=i*0.3; const osc=ctx.createOscillator(); const gain=ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); osc.type='sawtooth'; osc.frequency.setValueAtTime(i%2===0?600:800, ctx.currentTime+t); gain.gain.setValueAtTime(1, ctx.currentTime+t); gain.gain.setTargetAtTime(0, ctx.currentTime+t+0.25, 0.02); osc.start(ctx.currentTime+t); osc.stop(ctx.currentTime+t+0.3); } } else if(type==='bell') { [880,1100,1320].forEach((f,i)=>{ const osc=ctx.createOscillator(); const gain=ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); osc.type='sine'; osc.frequency.setValueAtTime(f,ctx.currentTime+i*0.15); gain.gain.setValueAtTime(0.15,ctx.currentTime+i*0.15); gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+i*0.15+0.4); osc.start(ctx.currentTime+i*0.15); osc.stop(ctx.currentTime+i*0.15+0.4); }); } else { const osc=ctx.createOscillator(); const gain=ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); osc.type='sine'; if(type==='success'){osc.frequency.setValueAtTime(880,ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(1200,ctx.currentTime+0.1); gain.gain.setValueAtTime(0.1,ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.3);} else {osc.frequency.setValueAtTime(440,ctx.currentTime); gain.gain.setValueAtTime(0.1,ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.5);} osc.start(); osc.stop(ctx.currentTime+0.5); } } catch(e){} };

    window.save = () => {
        try {
            if(!window.state.db.orders) window.state.db.orders = [];
            localStorage.setItem('f_menu', JSON.stringify(window.state.db.menu));
            localStorage.setItem('f_orders', JSON.stringify(window.state.db.orders));
            localStorage.setItem('f_exp', JSON.stringify(window.state.db.exp));
            localStorage.setItem('f_shift', JSON.stringify(window.state.db.shift));
            localStorage.setItem('f_tables', JSON.stringify(window.state.db.tables));
            localStorage.setItem('f_history', JSON.stringify(window.state.db.shifts_history));
            localStorage.setItem('f_stock_history', JSON.stringify(window.state.db.stock_history));
            localStorage.setItem('f_employees', JSON.stringify(window.state.db.employees));
            localStorage.setItem('f_attendance', JSON.stringify(window.state.db.attendance));
            if(database) { const safeDb = JSON.parse(JSON.stringify(window.state.db)); database.ref('foush').set(safeDb).catch(e=>console.error("Firebase save error:", e)); }
            window.render();
        } catch(e) { console.error("Critical Save Error", e); window.render(); }
    };

    window.login = (r) => { const p=prompt("Password:"); if(p==='123'||r==='kitchen'){ sessionStorage.setItem('foush_role', r); window.state.role=r; window.state.page = (r==='kitchen')?'kitchen':(r==='waiter'?'waiter':'pos'); sessionStorage.setItem('foush_last_page', window.state.page); window.boot(); window.playSound('success'); } };
    window.logout = () => { sessionStorage.removeItem('foush_role'); location.reload(); };
    window.startShift = () => { window.state.db.shift = { start: Date.now() }; window.save(); };
    window.showToast = (m) => { const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2500); };
    
    window.showMobileMenu = () => {
        const links = {
            waiter: [{id:'waiter',label:'الطاولات',icon:'bell-concierge'}], 
            kitchen: [{id:'kitchen',label:'المطبخ',icon:'fire-burner'}], 
            cashier: [{id:'pos',label:'الكاشير',icon:'cash-register'},{id:'dashboard',label:'المتابعة',icon:'chart-line'},{id:'inventory',label:'المخزن',icon:'box'},{id:'expenses',label:'المصروفات',icon:'money-bill'},{id:'tables',label:'الطاولات',icon:'chair'}], 
            manager: [{id:'pos',label:'الكاشير',icon:'cash-register'},{id:'dashboard',label:'المتابعة',icon:'chart-line'},{id:'inventory',label:'المخزن',icon:'box'},{id:'expenses',label:'المصروفات',icon:'money-bill'},{id:'tables',label:'الطاولات',icon:'chair'},{id:'employees',label:'الموظفين',icon:'users'},{id:'reports',label:'التقارير',icon:'clock-rotate-left'}] 
        };
        const myLinks = links[window.state.role] || [];
        const hiddenLinks = myLinks.slice(4);
        const container = document.getElementById('mobile-menu-links');
        if(container) {
            container.innerHTML = hiddenLinks.map(x=>`<button onclick="document.getElementById('mobile-menu-modal').style.display='none'; window.switchPage('${x.id}')" class="sidebar-link ${window.state.page===x.id?'active':''}" style="margin-bottom:5px; text-align:right;"><i class="fa-solid fa-${x.icon}"></i> ${x.label}</button>`).join('');
        }
        document.getElementById('mobile-menu-modal').style.display = 'flex';
    };
    
    window.addToCart = (id) => { 
        const m = window.state.db.menu.find(x=>x.id===id); if(!m) return;
        const inCartCount = window.state.cart.filter(x=>x.id===id).reduce((s,x)=>s+x.qty,0);
        if(!m.unlimited && m.stock <= inCartCount) { window.showToast("لا يوجد رصيد كافي!"); return; }
        const inCart = window.state.cart.find(x=>x.id===id); if(inCart) inCart.qty++; else window.state.cart.push({...m, qty:1}); window.render(); 
    };

    window.confirmOrder = () => {
        try {
            if(window.state.cart.length===0) return;
            if(!window.state.db.shift) { window.showToast("يرجى فتح وردية أولاً!"); return; }
            if(window.state.type==='salla' && window.state.selectedTable==='خارجي') { window.showToast("يرجى اختيار طاولة أولاً! 🪑"); return; }
            
            const tab = (window.state.db.tables||[]).find(t=>t.name===window.state.selectedTable);
            const sourceCol = tab ? (tab.source || 'cashier') : 'cashier';
            const notes = document.getElementById('pos-notes') ? document.getElementById('pos-notes').value : '';
            const o = { id: (window.state.db.orders||[]).length + 1, items: [...window.state.cart], total: window.state.cart.reduce((s,i)=>s+(i.price*i.qty),0), type: window.state.type, table: window.state.selectedTable, status: 'preparing', time: Date.now(), source: sourceCol, paid: window.state.type!=='salla', notes: notes };
            
            if(o.type==='salla') { 
                o.items.forEach(item => { const m = window.state.db.menu.find(x=>x.id===item.id); if(m && !m.unlimited) m.stock -= item.qty; });
                if(!Array.isArray(window.state.db.orders)) window.state.db.orders = [];
                window.state.db.orders.unshift(o); 
                window.state.cart=[]; window.state.selectedTable='خارجي'; window.state.posNotes='';
                window.save(); 
                window.showToast("تم الإرسال للمطبخ ✅"); window.playSound('success');
            } else { 
                window.state.tempOrder = o; 
                window.showReceiptPreview(o); 
            }
        } catch(e) { console.error("Confirm Order Error", e); window.showToast("خطأ في تسجيل الطلب!"); }
    };

    window.showReceiptPreview = (o) => {
        window.state.tempOrder = o;
        document.getElementById('receipt-discount').value = o.discount || '';
        document.getElementById('receipt-payment').value = o.paymentMethod || 'cash';
        
        if(o.type !== 'salla' && !o.customerName) {
            document.getElementById('receipt-customer-info').style.display = 'block';
            document.getElementById('receipt-cust-name').value = '';
            document.getElementById('receipt-cust-phone').value = '';
        } else {
            document.getElementById('receipt-customer-info').style.display = 'none';
        }

        window.updateReceiptPreview();
        document.getElementById('receipt-modal').style.display='flex';
        
        setTimeout(() => {
            if(o.type === 'delivery') document.getElementById('receipt-cust-phone').focus();
            else document.getElementById('receipt-confirm-btn').focus();
        }, 100);
    };

    window.updateReceiptPreview = () => {
        const o = window.state.tempOrder; if(!o) return;
        const discount = Number(document.getElementById('receipt-discount').value) || 0;
        o.discount = discount; o.paymentMethod = document.getElementById('receipt-payment').value;
        if (o.type !== 'salla' && document.getElementById('receipt-customer-info').style.display === 'block') {
            o.customerName = document.getElementById('receipt-cust-name').value;
            o.customerPhone = document.getElementById('receipt-cust-phone').value;
        }
        const finalTotal = o.total - discount;
        const html = `<div style="text-align:center; color:#000;"><h1 style="font-family:'Orbitron'; font-size:1.8rem; margin:0;">FOUSH</h1><p style="font-weight:900; margin:0; font-size:0.9rem;">فؤش ابن سيد للطواجن</p><p style="font-size:0.7rem; margin:0;">${new Date(o.time).toLocaleString('ar-EG')}</p><hr style="border:1px dashed #000; margin:5px 0;"><h2 style="font-size:2rem; margin:0;">#${o.id}</h2><p style="font-weight:900; margin:0;">${o.type==='salla'?`الطاولة: ${o.table}`: o.type==='delivery'?`دليفري`:`تيك أواي`}</p>${o.customerName?`<p style="font-weight:900; font-size:0.9rem; border:1px solid #000; padding:3px; border-radius:5px; margin:5px 0 0 0;">العميل: ${o.customerName} | ${o.customerPhone}</p>`:''}</div><div style="color:#000; margin-top:8px;">${o.items.map(i=>`<div style="display:flex; justify-content:space-between; font-size:1rem; font-weight:900; margin-bottom:2px;"><span>${i.name} x${i.qty}</span><span>${i.price*i.qty} ج</span></div>`).join('')}</div><hr style="border:1px dashed #000; margin:5px 0;">${discount>0?`<div style="display:flex; justify-content:space-between; font-size:1.1rem; font-weight:900; color:#ef4444; margin:0;"><span>خصم:</span><span>-${discount} ج</span></div>`:''}<div style="display:flex; justify-content:space-between; font-size:1.5rem; font-weight:900; color:#000; margin:0;"><span>الإجمالي:</span><span>${finalTotal} ج</span></div><p style="text-align:center; font-weight:900; font-size:0.9rem; margin:5px 0 0 0; color:#000; border-top:1px dashed #000; padding-top:3px;">الدفع: ${o.paymentMethod==='visa'?'فيزا 💳':o.paymentMethod==='wallet'?'محفظة 📱':'كاش 💵'}</p><p style="text-align:center; margin:2px 0 0 0; color:#000; font-weight:900; font-size:0.7rem;">نورتنا يا فؤش! ❤️ مملكة الطواجن</p>`;
        document.getElementById('receipt-preview').innerHTML = html;
    };

    window.finalizeTransaction = () => { 
        try {
            if(!window.state.tempOrder) return;
            const o = {...window.state.tempOrder}; o.paid=true; if(o.type==='salla') o.status = 'completed';
            
            if(o.type !== 'salla' && document.getElementById('receipt-customer-info').style.display === 'block') {
                const cName = document.getElementById('receipt-cust-name').value;
                const cPhone = document.getElementById('receipt-cust-phone').value;
                if(o.type === 'delivery' && (!cName || !cPhone)) {
                    window.showToast("برجاء إدخال بيانات العميل للدليفري!");
                    return;
                }
                o.customerName = cName;
                o.customerPhone = cPhone;
            }

            if(!Array.isArray(window.state.db.orders)) window.state.db.orders = [];
            const existingIdx = window.state.db.orders.findIndex(x=>String(x.id)===String(o.id));
            if(existingIdx !== -1) { 
                window.state.db.orders[existingIdx].paid=true; 
                window.state.db.orders[existingIdx].discount=o.discount;
                window.state.db.orders[existingIdx].paymentMethod=o.paymentMethod;
                window.state.db.orders[existingIdx].customerName=o.customerName;
                window.state.db.orders[existingIdx].customerPhone=o.customerPhone;
                if(o.type==='salla') window.state.db.orders[existingIdx].status='completed'; 
            }
            else { o.items.forEach(item => { const m = window.state.db.menu.find(x=>x.id===item.id); if(m && !m.unlimited) m.stock -= item.qty; }); window.state.db.orders.unshift(o); }
            
            document.getElementById('receipt-modal').style.display='none';
            window.state.tempOrder = o; window.updateReceiptPreview();
            const printDiv = document.getElementById('print-area'); printDiv.innerHTML = document.getElementById('receipt-preview').innerHTML; 
            
            window.state.cart=[]; window.state.tempOrder=null;
            window.save(); 
            window.showToast("تم الحساب ✅"); window.playSound('success');
            setTimeout(() => { try { window.print(); } catch(e){} }, 300);
        } catch(e) { console.error("Finalize Error", e); window.showToast("خطأ في الحساب!"); }
    };
    window.closeReceipt = () => { window.state.tempOrder=null; document.getElementById('receipt-modal').style.display='none'; };

    window.drillDown = (type) => {
        const title = document.getElementById('drilldown-title'); const content = document.getElementById('drilldown-content'); document.getElementById('drilldown-modal').style.display = 'flex';
        const orders = window.state.db.orders || [];
        if(type==='exp') { title.textContent = "مصروفات الوردية الحالية"; content.innerHTML = `<table class="foush-table"><thead><tr><th>البيان</th><th>التفاصيل</th><th>المبلغ</th></tr></thead><tbody>${(window.state.db.exp||[]).map(e=>`<tr><td>${e.name}</td><td>${e.details||'-'}</td><td>${e.amount} ج</td></tr>`).join('')}</tbody></table>`; }
        else if(type==='sales') { title.textContent = "سجل الأوردرات المدفوعة"; content.innerHTML = orders.filter(o=>o.paid).map(o=>`<div class="order-card" style="border-right-color:var(--primary);"><h4>#${o.id} - ${o.table}</h4><p>${o.items.map(i=>`${i.name} x${i.qty}`).join('، ')}</p><p style="margin:5px 0; font-size:0.85rem; opacity:0.8;"><i class="fa-regular fa-clock"></i> ${new Date(o.time).toLocaleTimeString('ar-EG')}</p><div style="display:flex; justify-content:space-between; margin-top:5px; align-items:center;"><span style="color:var(--primary); font-weight:900; font-size:1.2rem;">${o.total-(o.discount||0)} ج</span><span style="font-size:0.8rem; background:rgba(255,255,255,0.1); padding:4px 8px; border-radius:5px; font-weight:900;">${o.paymentMethod==='visa'?'فيزا 💳':o.paymentMethod==='wallet'?'محفظة 📱':'كاش 💵'}</span></div></div>`).join('') || '<p style="text-align:center;">لا توجد مبيعات حتى الآن</p>'; }
        else if(type==='kitchen') { title.textContent = "أوردرات المطبخ الآن"; content.innerHTML = orders.filter(o=>o.status==='preparing').map(o=>`<div class="order-card"><h4>#${o.id} - ${o.table}</h4><p>${o.items.map(i=>`${i.name} x${i.qty}`).join('، ')}</p></div>`).join('') || '<p style="text-align:center;">المطبخ هادي حالياً 🧊</p>'; }
        else if(type==='ready') { title.textContent = "أوردرات جاهزة للتسليم"; content.innerHTML = orders.filter(o=>o.status==='ready').map(o=>`<div class="order-card" style="border-right-color:var(--success);"><h4>#${o.id} - ${o.table}</h4><p>${o.items.map(i=>`${i.name} x${i.qty}`).join('، ')}</p></div>`).join('') || '<p style="text-align:center;">لا توجد أوردرات جاهزة</p>'; }
        else if(type==='canceled') { title.textContent = "الأوردرات الملغاة"; content.innerHTML = orders.filter(o=>o.status==='canceled').map(o=>`<div class="order-card" style="border-right-color:var(--danger);"><h4>#${o.id} - ${o.table}</h4><p>${o.items.map(i=>`${i.name} x${i.qty}`).join('، ')}</p><p style="color:var(--danger); font-weight:900;">${o.total} ج (تم الاسترجاع)</p></div>`).join('') || '<p style="text-align:center;">لا توجد أوردرات ملغاة</p>'; }
    };

    window.switchPage = (p) => { window.state.page = p; sessionStorage.setItem('foush_last_page', p); window.render(); };

    window.render = () => {
        try {
            document.querySelectorAll('.page-container').forEach(v=>{ v.classList.remove('active'); v.innerHTML=''; }); 
            const c = document.getElementById('page-'+window.state.page); if(c) c.classList.add('active'); else return;
            if(window.state.page==='pos') renderPOS(c); else if(window.state.page==='dashboard') renderDashboard(c); else if(window.state.page==='kitchen') renderKitchen(c); else if(window.state.page==='inventory') renderInventory(c); else if(window.state.page==='expenses') renderExpenses(c); else if(window.state.page==='tables') renderTables(c); else if(window.state.page==='reports') renderReports(c); else if(window.state.page==='employees') renderEmployees(c); else if(window.state.page==='waiter') renderWaiter(c);
            renderSidebar();
            const isWorkingRole = (window.state.role==='cashier'||window.state.role==='waiter'||window.state.role==='manager');
            const hasShift = !!window.state.db.shift;
            document.getElementById('shift-modal').style.display = (!hasShift && isWorkingRole) ? 'flex' : 'none';
            document.getElementById('end-shift-btn').style.display = (hasShift && (window.state.role==='manager'||window.state.role==='cashier')) ? 'block' : 'none';
            document.getElementById('timer').style.display = hasShift ? 'block' : 'none';
        } catch(e) { console.error("Render Error:", e); }
    };

    function renderPOS(c) {
        const total = window.state.cart.reduce((s,i)=>s+(i.price*i.qty),0); const busyOrders = (window.state.db.orders||[]).filter(o=>o.type==='salla'&&!o.paid && o.status!=='completed');
        const filteredTables = window.state.db.tables||[];
        
        window.state.posTab = window.state.posTab || 'items';
        const cartCount = window.state.cart.reduce((sum, item) => sum + item.qty, 0);
        
        const tabHtml = `
        <div class="pos-mobile-tabs">
            <button onclick="window.state.posTab='items'; window.render();" class="pos-tab-btn ${window.state.posTab==='items'?'active':''}">الأصناف 🥘</button>
            <button onclick="window.state.posTab='cart'; window.render();" class="pos-tab-btn ${window.state.posTab==='cart'?'active':''}">
                السلة والطلب 🛒 ${cartCount > 0 ? `<span class="cart-badge-count">${cartCount}</span>` : ''}

        c.innerHTML = `${tabHtml}<div class="pos-layout ${window.state.posTab==='cart'?'show-cart':'show-items'}"><div class="items-side"><div style="display:flex; gap:8px; margin-bottom:8px; overflow-x:auto;" class="hide-scroll">${['الكل','طواجن','أرز وفتة','شوربة','سلطات','مشروبات'].map(cat=>`<button onclick="window.state.cat='${cat}'; window.render();" class="btn-luxury" style="width:auto; padding:8px 20px; background:${window.state.cat===cat?'var(--primary)':'#1e293b'}; color:${window.state.cat===cat?'#000':'#fff'}">${cat}</button>`).join('')}</div><div class="items-grid hide-scroll">${window.state.db.menu.filter(m=>window.state.cat==='الكل'||m.category===window.state.cat).map(m=>`<div class="pos-card ${(!m.unlimited && m.stock<=0)?'out-of-stock':''} ${(!m.unlimited && m.stock<10)?'low-stock':''}" onclick="window.addToCart(${m.id})"><h3>${m.name}</h3><p style="color:var(--primary); font-weight:900;">${m.price} ج</p>${!m.unlimited?`<small style="opacity:0.7; font-weight:900; font-size:0.7rem;">متاح: ${m.stock}</small>`:''}</div>`).join('')}</div></div><div class="cart-side"><div style="display:flex; gap:5px; margin-bottom:10px;">${['salla','takeaway','delivery'].map(t=>`<button onclick="window.state.type='${t}'; window.render();" class="btn-luxury" style="background:${window.state.type===t?'var(--primary)':'#0f172a'}; color:${window.state.type===t?'#000':'#fff'}; font-size:0.8rem;">${t==='salla'?'صالة':t==='takeaway'?'تيك':'دلي'}</button>`).join('')}</div>${window.state.type==='salla'?'<div style="display:flex; flex-direction:column; gap:10px; margin-bottom:10px;"><div class="table-grid">'+filteredTables.filter(t=>(t.source||'cashier')==='cashier').map(t=>{ const busy=busyOrders.find(o=>o.table===t.name); return `<div onclick="${busy?`window.settleOrder('${busy.id}')`:`window.state.selectedTable='${t.name}'; window.render();`}" class="table-btn ${window.state.selectedTable===t.name?'active':''} ${busy?(busy.status==='billing'?'billing':'busy'):''}"><span>${t.name     }

    function renderDashboard(c) {

<i class="fa-solid fa-xmark"></i></button></div></div></div>`).join('')}</div></div>`).join('')}</div>`;
    }

                <div style="display:flex; flex-direction:column; gap:10px;">${readySalla.map(o=>`<div class="order-card" style="width:100%; border:2px solid var(--success); opacity:0.9; padding:8px;"><div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;"><div style="background:var(--success); color:#fff; font-weight:900; font-size:0.9rem; border-radius:5px; padding:2px 6px;">${o.table}</div><div class="order-timer-premium" style="font-size:0.9rem; background:rgba(0,0,0,0.4); padding:2px 6px; border-radius:8px;"><div class="timer-dot" style="background:var(--success);"></div><span class="timer-text" data-start="${o.time}">00:00</span></div></div><div style="flex:1; margin:6px 0;">${o.items.map(i=>`<div style="font-size:0.9rem; font-weight:900; opacity:0.8; border-bottom:1px dashed rgba(255,255,255,0.05); padding:3px 0;">${i.name} <span style="color:var(--success); float:left;">x${i.qty}</span></div>`).join('')}</div><div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px;"><button onclick="window.kitchenAction('${o.id}','preparing')" class="btn-luxury" style="background:transparent; border:1px solid var(--danger); color:var(--danger); padding:3px 6px; font-size:0.75rem; width:auto;">إرجاع ↩️</button><button onclick="window.kitchenAction('${o.id}','served')" class="btn-luxury" style="background:var(--success); color:#fff; padding:4px 10px; font-size:0.9rem; width:auto; border:none;">تم التسليم للويتر 🚀</button></div></div>`).join('')}</div>

                <h3 style="color:#0ea5e9; text-align:center; margin-bottom:15px; font-family:'Orbitron'; font-size:1.1rem;">جاهز (خارجي) 📦 (${readyExternal.length})</h3>
                <div style="display:flex; flex-direction:column; gap:10px;">${readyExternal.map(o=>`<div class="order-card" style="width:100%; border:2px solid #0ea5e9; opacity:0.9; padding:8px;"><div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;"><div style="background:#0ea5e9; color:#fff; font-weight:900; font-size:0.9rem; border-radius:5px; padding:2px 6px;">${o.type==='takeaway'?'تيك اواي':'دليفري'}</div><div class="order-timer-premium" style="font-size:0.9rem; background:rgba(0,0,0,0.4); padding:2px 6px; border-radius:8px;"><div class="timer-dot" style="background:#0ea5e9;"></div><span class="timer-text" data-start="${o.time}">00:00</span></div></div><div style="flex:1; margin:6px 0;">${o.items.map(i=>`<div style="font-size:0.9rem; font-weight:900; opacity:0.8; border-bottom:1px dashed rgba(255,255,255,0.05); padding:3px 0;">${i.name} <span style="color:#0ea5e9; float:left;">x${i.qty}</span></div>`).join('')}</div><div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px;"><button onclick="window.kitchenAction('${o.id}','preparing')" class="btn-luxury" style="background:transparent; border:1px solid var(--danger); color:var(--danger); padding:3px 6px; font-size:0.75rem; width:auto;">إرجاع ↩️</button><button onclick="window.kitchenAction('${o.id}','completed')" class="btn-luxury" style="background:var(--success); color:#fff; padding:4px 10px; font-size:0.9rem; width:auto; border:none;">تم التسليم 🚀</button></div></div>`).join('')}</div>

                return `<div onclick="${busy?`window.state.waiterViewOrder='${busy.id}'; window.state.waiterStage='view'; window.render();`:`window.state.waiterTable='${t.name}'; window.state.waiterStage='menu'; window.state.waiterCart=[]; window.state.waiterNotes=''; window.render();`}" class="table-btn ${busy?'busy':''} ${busy&&busy.status==='billing'?'billing':''}" style="width:130px; height:130px; font-size:1.5rem; display:flex; flex-direction:column; justify-content:center; align-items:center; border-color:${statusColor}; ${busy&&(busy.status==='ready'||busy.status==='billing')?`background:${busy.status==='ready'?'rgba(16,185,129,0.15)':'rgba(168,85,247,0.15)'};`:''}"><span>${t.name}</span><small style="font-size:0.8rem; margin-top:5px; color:${statusColor}; font-weight:900;">${statusText}</small>${busy?`<small style="font-size:0.7rem; opacity:0.7; margin-top:2px;">${busy.total} ج</small>`:''}</div>`;

            contentHtml = `<div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; padding:10px; height:calc(100vh - 150px);">
                <div class="cart-side" style="border-color:var(--success); overflow-y:auto;">
                    <h3 style="text-align:center; color:var(--success); margin-bottom:10px; font-family:'Orbitron';">جاهز للاستلام ✅ (${ready.length})</h3>
                    <div style="display:flex; flex-direction:column; gap:10px;">${ready.map(o=>`<div class="order-card" style="border-color:var(--success); padding:10px;"><div style="display:flex; justify-content:space-between; align-items:center;"><h4>${o.table}</h4><span class="badge badge-ready">جاهز</span></div><div style="margin:8px 0; opacity:0.9; font-size:0.9rem;">${o.items.map(i=>`${i.name} x${i.qty}`).join('<br>')}</div><button onclick="window.waiterServeOrder('${o.id}')" class="btn-luxury" style="background:var(--success); color:#fff; width:100%; padding:10px; margin-top:5px; font-size:1.1rem; border:none;">تم التقديم للعميل 🍽️</button></div>`).join('') || '<p style="text-align:center; opacity:0.5;">لا توجد طلبات جاهزة</p>'}</div>
                </div>
                <div class="cart-side" style="border-color:var(--danger); overflow-y:auto;">

                    <div style="display:flex; flex-direction:column; gap:10px;">${prep.map(o=>`<div class="order-card" style="border-color:var(--danger); padding:10px;"><div style="display:flex; justify-content:space-between; align-items:center;"><h4>${o.table}</h4><span class="badge badge-preparing">تحضير</span></div><div style="margin:8px 0; opacity:0.9; font-size:0.9rem;">${o.items.map(i=>`${i.name} x${i.qty}`).join('<br>')}</div><div style="text-align:center; margin-top:5px; font-size:0.8rem; color:var(--danger); background:rgba(239,68,68,0.1); padding:5px; border-radius:5px;">في انتظار الشيف ⏳</div></div>`).join('') || '<p style="text-align:center; opacity:0.5;">لا توجد طلبات في المطبخ</p>'}</div>
                </div>
            </div>`;
        } else if (window.state.waiterStage === 'view') {
            const o = (window.state.db.orders||[]).find(x=>String(x.id)===String(window.state.waiterViewOrder));
            if(!o) { window.state.waiterStage='tables'; window.render(); return; }
            contentHtml = `<div style="max-width:500px; margin:0 auto; padding:10px;">
                <button onclick="window.state.waiterStage='tables'; window.render();" class="btn-luxury danger" style="width:auto; padding:8px 15px; margin-bottom:15px;">🔙 رجوع للطاولات</button>
                <div class="cart-side">
                    <h3 style="text-align:center; color:var(--primary); margin-bottom:10px;">${o.table} - طلب #${o.id}</h3>

                    ${o.notes?`<div style="background:rgba(251,191,36,0.1); border:1px solid var(--primary); border-radius:12px; padding:10px; margin-bottom:10px; text-align:center;"><i class="fa-solid fa-note-sticky"></i> ${o.notes}</div>`:''}
                    <div style="flex:1;">${o.items.map(i=>`<div style="display:flex; justify-content:space-between; padding:10px; background:rgba(0,0,0,0.2); border-radius:12px; margin-bottom:6px;"><span style="font-size:1.1rem; font-weight:900;">${i.name}</span><span style="color:var(--primary); font-weight:900;">x${i.qty}</span></div>`).join('')}</div>
                    <div style="border-top:2px solid var(--primary); padding-top:12px; text-align:center; margin-top:10px;">

                        ${o.status!=='completed' ? `<div style="display:flex; gap:10px;"><button onclick="window.waiterRequestBill('${o.id}')" class="btn-luxury" style="background:#a855f7; color:#fff; border:none; flex:1; font-size:1.1rem; padding:12px;">طلب حساب للكاشير 🔔</button><button onclick="window.settleOrder('${o.id}')" class="btn-luxury" style="background:var(--success); color:#fff; border:none; flex:1; font-size:1.1rem; padding:12px;">دفع وحساب 💰</button></div>`:''}
                    </div>
                </div>
            </div>`;
        } else if (window.state.waiterStage === 'menu') {
            if(!window.state.waiterCat) window.state.waiterCat = 'الكل';
            const total = (window.state.waiterCart||[]).reduce((s,i)=>s+(i.price*i.qty),0);
            contentHtml = `<div class="pos-layout"><div class="items-side">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <button onclick="window.state.waiterStage='tables'; window.render();" class="btn-luxury danger" style="width:auto; padding:8px 15px;">🔙 رجوع</button>
                    <h3 style="color:var(--primary);">طاولة: ${window.state.waiterTable}</h3>
                </div>
                <div style="display:flex; gap:8px; margin-bottom:8px; overflow-x:auto;" class="hide-scroll">${['الكل','طواجن','أرز وفتة','شوربة','سلطات','مشروبات'].map(cat=>`<button onclick="window.state.waiterCat='${cat}'; window.render();" class="btn-luxury" style="width:auto; padding:8px 20px; background:${window.state.waiterCat===cat?'var(--primary)':'#1e293b'}; color:${window.state.waiterCat===cat?'#000':'#fff'}">${cat}</button>`).join('')}</div>
                <div class="items-grid hide-scroll">${window.state.db.menu.filter(m=>window.state.waiterCat==='الكل'||m.category===window.state.waiterCat).map(m=>`<div class="pos-card ${(!m.unlimited && m.stock<=0)?'out-of-stock':''}" onclick="window.waiterAddToCart(${m.id})"><h3>${m.name}</h3><p style="color:var(--primary); font-weight:900;">${m.price} ج</p></div>`).join('')}</div>
            </div>
            <div class="cart-side">
                <h3 style="text-align:center; margin-bottom:10px; color:var(--primary);">الأوردر</h3>
                <div class="cart-items hide-scroll" style="flex:1;">${(window.state.waiterCart||[]).map((i,idx)=>`<div style="display:flex; justify-content:space-between; align-items:center; background:rgba(0,0,0,0.2); padding:10px; border-radius:12px; margin-bottom:6px; border:1px solid rgba(255,255,255,0.03);"><div><span style="font-size:1rem;">${i.name}</span><br><small style="color:var(--primary); font-size:0.9rem;">${i.price*i.qty} ج</small></div><div style="display:flex; align-items:center; gap:8px;"><button onclick="window.waiterQty(${idx},-1)" style="background:var(--danger); color:#fff; border:none; border-radius:8px; width:30px; height:30px; cursor:pointer; font-size:1rem; font-weight:900;">-</button><span style="font-size:1.1rem; font-weight:900; min-width:25px; text-align:center;">${i.qty}</span><button onclick="window.waiterQty(${idx},1)" style="background:var(--success); color:#fff; border:none; border-radius:8px; width:30px; height:30px; cursor:pointer; font-size:1rem; font-weight:900;">+</button></div></div>`).join('')}</div>
                <input id="waiter-notes" placeholder="ملاحظات للمطبخ (بدون بصل، زيادة رز...)" class="input-luxury" style="margin-bottom:8px; font-size:0.9rem;" value="${window.state.waiterNotes||''}" onchange="window.state.waiterNotes=this.value">
                <div style="border-top:2px solid var(--primary); padding-top:12px; text-align:center;">

    window.waiterAddToCart = (id) => {
        const m = window.state.db.menu.find(x=>x.id===id); if(!m) return;
        const inCartCount = (window.state.waiterCart||[]).filter(x=>x.id===id).reduce((s,x)=>s+x.qty,0);
        if(!m.unlimited && m.stock <= inCartCount) { window.showToast("لا يوجد رصيد كافي!"); return; }
        const inCart = (window.state.waiterCart||[]).find(x=>x.id===id); if(inCart) inCart.qty++; else { if(!window.state.waiterCart) window.state.waiterCart=[]; window.state.waiterCart.push({...m, qty:1}); }
        window.render();
    };

    window.waiterQty = (idx, delta) => {
        if(!window.state.waiterCart || !window.state.waiterCart[idx]) return;
        window.state.waiterCart[idx].qty += delta;
        if(window.state.waiterCart[idx].qty <= 0) window.state.waiterCart.splice(idx, 1);
        window.render();
    };

    window.waiterConfirmOrder = () => {
        if(!window.state.waiterCart || window.state.waiterCart.length===0) return;
        if(!window.state.db.shift) { window.showToast("يرجى فتح وردية أولاً!"); return; }
        const notes = document.getElementById('waiter-notes') ? document.getElementById('waiter-notes').value : '';
        
        const o = { id: (window.state.db.orders||[]).length + 1, items: [...window.state.waiterCart], total: window.state.waiterCart.reduce((s,i)=>s+(i.price*i.qty),0), type: 'salla', table: window.state.waiterTable, status: 'preparing', time: Date.now(), source: 'waiter', paid: false, notes: notes };
        o.items.forEach(item => { const m = window.state.db.menu.find(x=>x.id===item.id); if(m && !m.unlimited) m.stock -= item.qty; });
        if(!Array.isArray(window.state.db.orders)) window.state.db.orders = [];
        window.state.db.orders.unshift(o); 
        
        window.state.waiterCart=[]; window.state.waiterStage='tables'; window.state.waiterTable=null; window.state.waiterNotes='';
        window.save(); 
        window.showToast("تم إرسال الطلب للمطبخ بنجاح! ✅"); window.playSound('success');
    };

    window.addEmployee = () => { const n=document.getElementById('emp-name').value; const r=document.getElementById('emp-role').value; const p=document.getElementById('emp-pin').value; if(n && p){ window.state.db.employees.push({id:Date.now(), name:n, role:r, pin:p}); window.save(); window.render(); window.showToast("تم إضافة الموظف ✅"); } };
    window.deleteEmployee = (id) => { if(confirm('حذف الموظف نهائياً؟')){ window.state.db.employees = window.state.db.employees.filter(e=>e.id!==id); window.save(); window.render(); window.showToast("تم الحذف"); } };
    
    window.registerAttendance = () => {
        const pin = document.getElementById('att-pin').value; const msg = document.getElementById('att-msg');
        if(!pin) return;
        const emp = (window.state.db.employees||[]).find(e => e.pin === pin);
        if(!emp) { msg.textContent = "الكود غير صحيح!"; window.playSound('error'); return; }
        
        const att = window.state.db.attendance||[];
        const lastRec = att.slice().reverse().find(a => a.empId === emp.id);
        const type = (lastRec && lastRec.type === 'in') ? 'out' : 'in';
        
        att.push({ empId: emp.id, type: type, time: Date.now() });
        window.state.db.attendance = att; window.save();
        
        msg.style.color = type==='in' ? 'var(--success)' : 'var(--primary)';
        msg.textContent = `تم تسجيل ${type==='in'?'الحضور':'الانصراف'}: ${emp.name} ✅`;
        window.playSound('success');
        
        setTimeout(() => {
            document.getElementById('att-pin').value = '';
            msg.textContent = '';
            document.getElementById('attendance-modal').style.display = 'none';
        }, 1500);
    };

    window.kitchenAction = (id, next) => { const o = window.state.db.orders.find(x=>String(x.id)===String(id)); if(o) { o.status = next; window.save(); if(next==='ready') { window.showToast(`طلب #${id} جاهز للتسليم! 📤`); window.playSound('success'); } } };
    window.settleOrder = (id) => { const o = window.state.db.orders.find(x=>String(x.id)===String(id)); if(o) { window.state.tempOrder = {...o}; window.showReceiptPreview(window.state.tempOrder); } };
    window.completeOrder = (id) => { const o = window.state.db.orders.find(x=>String(x.id)===String(id)); if(o) { o.status = 'completed'; window.save(); window.showToast("تم تسليم الطلب ✅"); } };
    window.cancelOrder = (id) => { if(confirm('إلغاء الطلب؟')) { const o = window.state.db.orders.find(x=>String(x.id)===String(id)); if(o) { o.status = 'canceled'; window.save(); window.showToast("تم إلغاء الطلب ❌"); } } };
    window.waiterServeOrder = (id) => { const o = window.state.db.orders.find(x=>String(x.id)===String(id)); if(o) { o.status = 'served'; window.save(); window.showToast("تم تقديم الطلب للعميل 🍽️"); window.playSound('success'); } };
    window.waiterRequestBill = (id) => { const o = window.state.db.orders.find(x=>String(x.id)===String(id)); if(o) { o.status = 'billing'; window.save(); window.showToast("تم إرسال طلب الحساب للكاشير 💰🔔"); window.playSound('bell'); } };
    window.saveExpense = () => { const n=document.getElementById('ex-name').value; const d=document.getElementById('ex-details').value; const a=document.getElementById('ex-amount').value; if(n && a){ if(!window.state.db.exp) window.state.db.exp = []; window.state.db.exp.unshift({name:n, details:d, amount:Number(a), time:Date.now()}); window.save(); document.getElementById('ex-name').value=''; document.getElementById('ex-details').value=''; document.getElementById('ex-amount').value=''; window.playSound('success'); window.showToast("تم حفظ المصروف ✅"); } };
    window.addTable = () => { const n=document.getElementById('new-tab-name').value; const src=document.getElementById('new-tab-source').value; if(n){ window.state.db.tables.push({id:Date.now(), name:n, source:src}); window.save(); document.getElementById('new-tab-name').value=''; window.showToast("تم إضافة الطاولة ✅"); } };
    window.deleteTable = (id) => { if(confirm('حذف الطاولة؟')) { window.state.db.tables = window.state.db.tables.filter(t=>t.id!==id); window.save(); } };
    window.openTableEdit = (id) => { window.state.editingTableId = id; const t = window.state.db.tables.find(x=>x.id===id); document.getElementById('edit-tab-name').value = t.name; document.getElementById('edit-tab-source').value = t.source; document.getElementById('table-edit-modal').style.display = 'flex'; };
    window.finalizeTableEdit = () => { const t = window.state.db.tables.find(x=>x.id===window.state.editingTableId); if(t){ t.name = document.getElementById('edit-tab-name').value; t.source = document.getElementById('edit-tab-source').value; window.save(); document.getElementById('table-edit-modal').style.display = 'none'; } };
    window.saveNewItem = () => { const n=document.getElementById('inv-name').value; const p=document.getElementById('inv-price').value; const c=document.getElementById('inv-cat-select').value; const s=document.getElementById('inv-stock-input').value; if(n && p){ window.state.db.menu.push({id:Date.now(), name:n, price:Number(p), category:c, stock:Number(s), unlimited:false}); window.save(); document.getElementById('inventory-modal').style.display='none'; } };
    window.deleteItem = (id) => { if(confirm('حذف الصنف؟')) { window.state.db.menu = window.state.db.menu.filter(m=>m.id!==id); window.save(); } };
    window.openStockUpdate = (id) => { const m = window.state.db.menu.find(x=>x.id==id); if(m){ window.state.selectedItemId=id; document.getElementById('stock-item-name-input').value=m.name; document.getElementById('stock-item-price-input').value=m.price; document.getElementById('stock-new-val').value=''; document.getElementById('stock-update-modal').style.display='flex'; } };
    window.finalizeStockUpdate = () => { const m = window.state.db.menu.find(x=>x.id==window.state.selectedItemId); if(m){ m.name = document.getElementById('stock-item-name-input').value; m.price = Number(document.getElementById('stock-item-price-input').value); const addVal = Number(document.getElementById('stock-new-val').value || 0); m.stock += addVal; window.save(); document.getElementById('stock-update-modal').style.display='none'; window.showToast("تم تعديل الصنف بنجاح ✅"); } };

    window.showShiftSummary = () => {
        const orders = window.state.db.orders || []; const activeOrders = orders.filter(o=>o.status!=='canceled'); 
        const sales = activeOrders.filter(o=>o.paid).reduce((s,o)=>s+o.total-(o.discount||0),0); 
        const cashSales = activeOrders.filter(o=>o.paid && (!o.paymentMethod || o.paymentMethod==='cash')).reduce((s,o)=>s+o.total-(o.discount||0),0);
        const visaSales = activeOrders.filter(o=>o.paid && o.paymentMethod==='visa').reduce((s,o)=>s+o.total-(o.discount||0),0);
        const walletSales = activeOrders.filter(o=>o.paid && o.paymentMethod==='wallet').reduce((s,o)=>s+o.total-(o.discount||0),0);
        const ex = (window.state.db.exp||[]).reduce((s,e)=>s+e.amount,0);
        const html = `<div style="display:flex; flex-direction:column; gap:10px; font-weight:700;"><div style="display:flex; justify-content:space-between; font-size:1.1rem;"><span>إجمالي المبيعات:</span><span style="color:var(--success);">${sales} ج</span></div><div style="display:flex; justify-content:space-between; font-size:0.9rem; opacity:0.8; padding-right:15px;"><span>كاش:</span><span>${cashSales} ج</span></div><div style="display:flex; justify-content:space-between; font-size:0.9rem; opacity:0.8; padding-right:15px;"><span>فيزا:</span><span>${visaSales} ج</span></div><div style="display:flex; justify-content:space-between; font-size:0.9rem; opacity:0.8; padding-right:15px;"><span>محفظة:</span><span>${walletSales} ج</span></div><hr style="border:1px dashed #ccc; margin:5px 0;"><div style="display:flex; justify-content:space-between; font-size:1.1rem;"><span>إجمالي المصروفات:</span><span style="color:var(--danger);">${ex} ج</span></div><hr style="border:1px dashed #ccc; margin:5px 0;"><div style="display:flex; justify-content:space-between; font-size:1.6rem; background:#f1f5f9; padding:10px; border-radius:10px;"><span>صافي الدرج (كاش):</span><span style="color:var(--panel);">${cashSales - ex} ج</span></div><p style="font-size:0.8rem; opacity:0.6; text-align:center; margin-top:5px;">بدأت الوردية في: ${new Date(window.state.db.shift.start).toLocaleString('ar-EG')}</p></div>`;
        document.getElementById('shift-summary-content').innerHTML = html; document.getElementById('shift-summary-modal').style.display = 'flex';
    };
    window.confirmEndShift = () => { const orders = window.state.db.orders || []; const activeOrders = orders.filter(o=>o.status!=='canceled'); const sales = activeOrders.filter(o=>o.paid).reduce((s,o)=>s+o.total-(o.discount||0),0); const cashSales = activeOrders.filter(o=>o.paid && (!o.paymentMethod || o.paymentMethod==='cash')).reduce((s,o)=>s+o.total-(o.discount||0),0); const visaSales = activeOrders.filter(o=>o.paid && o.paymentMethod==='visa').reduce((s,o)=>s+o.total-(o.discount||0),0); const walletSales = activeOrders.filter(o=>o.paid && o.paymentMethod==='wallet').reduce((s,o)=>s+o.total-(o.discount||0),0); const ex = (window.state.db.exp||[]).reduce((s,e)=>s+e.amount,0); window.state.db.shifts_history.unshift({ start: window.state.db.shift.start, end: Date.now(), sales, cashSales, visaSales, walletSales, expenses: ex, net: cashSales - ex }); window.state.db.shift = null; window.state.db.orders = []; window.state.db.exp = []; window.save(); sessionStorage.removeItem('foush_role'); location.reload(); };
    
    window.boot = () => { if(!window.state.role) { document.getElementById('role-screen').style.display='flex'; document.getElementById('app').style.display='none'; return; } document.getElementById('role-screen').style.display='none'; document.getElementById('app').style.display='grid'; window.render(); };
    window.boot();
    let lastOrdersData = [];
    if(database) { database.ref('foush').on('value', (s)=>{ const data = s.val(); if(data) { 
        const newOrders = data.orders || [];
        if(window.state.role === 'kitchen') {
            const newPrep = newOrders.filter(o=>o.status==='preparing');
            const oldPrep = lastOrdersData.filter(o=>o.status==='preparing');
            if(newPrep.length > oldPrep.length) window.playSound('kitchen-alert');
        } else if(window.state.role === 'cashier' || window.state.role === 'manager') {
            const newReady = newOrders.filter(o=>o.status==='ready');
            const oldReady = lastOrdersData.filter(o=>o.status==='ready');
            if(newReady.length > oldReady.length) window.playSound('bell');
            // Billing alert: when waiter requests bill
            const newBilling = newOrders.filter(o=>o.status==='billing');
            const oldBilling = lastOrdersData.filter(o=>o.status==='billing');
            if(newBilling.length > oldBilling.length) {
                window.playSound('bell'); window.playSound('bell');
                window.showToast('💰 الويتر طلب الحساب! تحقق من الطاولة');
            }
        } else if(window.state.role === 'waiter') {
            const newReady = newOrders.filter(o=>o.status==='ready' && o.source==='waiter');
            const oldReady = lastOrdersData.filter(o=>o.status==='ready' && o.source==='waiter');
            if(newReady.length > oldReady.length) { window.playSound('bell'); window.showToast('✅ طلبك جاهز في المطبخ! اطلع وقدمه'); }
        }
        lastOrdersData = newOrders;
        window.state.db = data;
        // Update billing badge in header
        const billingOrders = newOrders.filter(o=>o.status==='billing' && !o.paid);
        const badge = document.getElementById('billing-badge');
        const bCount = document.getElementById('billing-count');
        if(badge && bCount) {
            if(billingOrders.length > 0 && (window.state.role==='cashier'||window.state.role==='manager')) {
                bCount.textContent = billingOrders.length;
                badge.style.display = 'block';
            } else { badge.style.display = 'none'; }
        }
        window.render(); 
    } }); }
    setInterval(()=>{ document.getElementById('clock').textContent=new Date().toLocaleTimeString('ar-EG'); if(window.state.db.shift){ const d=Date.now()-window.state.db.shift.start; const h=Math.floor(d/3600000); const m=Math.floor((d%3600000)/60000); const s=Math.floor((d%60000)/1000); document.getElementById('shift-clock').textContent=`${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; } document.querySelectorAll('.timer-text').forEach(el => { const start = parseInt(el.dataset.start); const diff = Date.now() - start; const m = Math.floor(diff/60000); const s = Math.floor((diff%60000)/1000); el.textContent = `${m}:${s.toString().padStart(2,'0')}`; if(window.state.page === 'kitchen') { const card = el.closest('.order-card'); if(card && card.style.borderColor !== 'var(--success)') { const badge = card.querySelector('.table-badge'); if(m >= 15) { if(badge){ badge.style.background = 'var(--danger)'; badge.style.animation = 'pulse-red 1.5s infinite'; } el.previousElementSibling.style.background = 'var(--danger)'; } else if(m >= 10) { if(badge){ badge.style.background = '#f59e0b'; badge.style.animation = 'none'; } el.previousElementSibling.style.background = '#f59e0b'; } } } }); },1000);
</script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker registered successfully! ✅', reg.scope))
                .catch(err => console.error('Service Worker registration failed! ❌', err));
        });
    }
</script>
</body>
</html>
