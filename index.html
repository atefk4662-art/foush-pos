    <style>
        :root {
            --primary: #fbbf24;
            --primary-dark: #f59e0b;
            --bg: #0f172a;
            --panel: #1e293b;
            --text: #f8fafc;
            --danger: #ef4444;
            --success: #10b981;
            --sidebar-w: 240px;
            --header-h: 60px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .foush-persistent-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('logo.png') no-repeat center 10%;
            background-size: contain;
            opacity: 0.04;
            z-index: -1;
            pointer-events: none;
        }

        header {
            height: var(--header-h);
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
            backdrop-filter: blur(15px);
        }

        #app {
            flex: 1;
            display: none;
            grid-template-columns: var(--sidebar-w) 1fr;
            min-height: 0;
        }

        .sidebar {
            background: rgba(30, 41, 59, 0.8);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        .sidebar-link {
            padding: 12px;
            border-radius: 12px;
            color: #94a3b8;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
            border: none;
            background: transparent;
            text-align: right;
            width: 100%;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 4px;
            flex-shrink: 0;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background: rgba(251, 191, 36, 0.1) !important;
            color: var(--primary) !important;
            box-shadow: inset -4px 0 0 var(--primary);
        }

        .main-content {
            flex: 1;
            padding: 12px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            position: relative;
        }

        .page-container {
            flex: 1;
            display: none;
            min-height: 0;
            z-index: 1;
            overflow-y: auto;
        }

        .page-container.active {
            display: flex;
            flex-direction: column;
        }

        #page-pos {
            overflow: hidden !important;
        }

        .pos-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 12px;
            height: 100%;
            min-height: 0;
        }

        .items-side {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
            position: relative;
        }

        .items-side::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: url('logo.png') no-repeat center 20%;
            background-size: contain;
            opacity: 0.05;
            pointer-events: none;
            z-index: -1;
        }

        .items-grid {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
            align-content: start;
        }

        .cart-side {
            background: rgba(30, 41, 59, 0.7);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            padding: 15px;
            min-height: 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .pos-card {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 15px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.2s;
            position: relative;

        .pos-card:hover {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-3px);
        }

        .pos-card.out-of-stock {
            opacity: 0.5;
            filter: grayscale(1);
            pointer-events: none;
        }

        .pos-card.low-stock {
            border-color: var(--danger);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.2);
        }

            padding: 10px;
            border-radius: 12px;

            cursor: pointer;
            font-size: 1rem;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);

        .btn-luxury:hover {
            filter: brightness(1.2);
            transform: translateY(-2px);
        }

        .btn-luxury.danger {
            background: var(--danger);
            color: #fff;
        }

        #role-screen {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100000;
            overflow: hidden;
            padding: 20px;
        }

        .role-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('logo.png') no-repeat center 10%;

            opacity: 0.22;
            z-index: 0;
            filter: blur(1px);

        .role-grad {

            left: 0;

            height: 100%;
            background: radial-gradient(circle, rgba(15, 23, 42, 0.1) 0%, rgba(15, 23, 42, 1) 85%);

        .role-content {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
            max-width: 600px;
        }

        .role-logo-main {

            height: 180px;
            margin: 0 auto 20px;
            background: url('logo.png') no-repeat center center;
            background-size: contain;
            filter: drop-shadow(0 0 20px var(--primary));
            border: 4px solid var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(251, 191, 36, 0.4);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100000;

            align-items: center;
            justify-content: center;

        .modal-body {

            background: var(--panel);
            color: var(--text);

            flex-direction: column;
            border: 2px solid var(--primary);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .input-luxury {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 12px;
            color: #fff;
            width: 100%;
            outline: none;
            margin-bottom: 12px;
            font-size: 1rem;
        }

        #toast {

            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);

            color: #000;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: 900;
            z-index: 200000;
            display: none;
            box-shadow: 0 10px 30px rgba(251, 191, 36, 0.3);

        .badge {

            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 900;
        }

        .badge-preparing {
            background: rgba(251, 191, 36, 0.1);
            color: var(--primary);
        }

        .badge-ready {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .order-card,
        .inv-card {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.2s;
            position: relative;
        }

        .table-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 6px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            margin-bottom: 10px;
            max-height: 160px;
            overflow-y: auto;
        }

        .table-btn {

            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);

            color: #fff;
            cursor: pointer;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 700;
            transition: 0.2s;
        }

        .table-btn.active {
            border-color: var(--primary);
            background: rgba(251, 191, 36, 0.1);
            color: var(--primary);
        }

        .table-btn.busy {
            border-color: var(--danger);
            color: var(--danger);
            background: rgba(239, 68, 68, 0.2);
            animation: pulse-red 2s infinite;
        }

        .table-btn.billing {
            border-color: #a855f7;
            color: #a855f7;
            animation: pulse-purple 1.5s infinite;
        }

        .table-btn.ready {
            border-color: var(--success);
            color: var(--success);
            background: rgba(16, 185, 129, 0.15);
            animation: pulse-green 1.5s infinite;
        }

        @keyframes pulse-red {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        @keyframes pulse-purple {
            0% {
                box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.7);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(168, 85, 247, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(168, 85, 247, 0);
            }
        }

        @keyframes pulse-green {
            0% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(16, 185, 129, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            padding: 15px;
            flex: 1;
            text-align: center;
            border-bottom: 2px solid var(--primary);
            cursor: pointer;
            transition: 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.05);
        }

        .foush-table {
            width: 100%;
            border-collapse: collapse;
        }

        .foush-table th {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            text-align: right;
            color: var(--primary);
            font-size: 0.9rem;
            border-bottom: 1px solid var(--primary);
        }

        .foush-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 0.95rem;
            font-weight: 700;
        }

        .order-timer-premium {
            background: rgba(0, 0, 0, 0.2);
            padding: 3px 8px;
            border-radius: 15px;
            font-family: 'Orbitron';
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .timer-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.4;
            }
        }

        .hide-scroll::-webkit-scrollbar {
            display: none;
        }

        /* Mobile Navigation Bar */
        .mobile-nav {
            display: none;
        }

        .mobile-menu-modal {
            display: none;
        }

        .pos-mobile-tabs {
            display: none;
        }

        .kitchen-layout-grid {
            display: grid;
            grid-template-columns: 200px 1fr 1fr 1fr;
            gap: 15px;
            height: 100%;
        }

        .dashboard-columns {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        /* New Responsive Layout Helpers */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; width: 100%; margin-bottom: 20px; }
        .quick-access-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .expenses-layout-grid { display: grid; grid-template-columns: 320px 1fr; gap: 15px; height: 100%; min-height: 0; }
        .expense-form-grid { display: flex; flex-direction: column; gap: 12px; }

        .kitchen-mobile-tabs { display: none; }

                display: flex !important;

            }

            /* Stat Cards on Dashboard */
            .stat-card {

            }

            .role-content button {
                padding: 14px !important;
                font-size: 0.95rem !important;
            }
        }

        @media print {
            body>*:not(#print-area) {
                display: none !important;
            }

            #print-area {
                display: block !important;
                width: 80mm;
                background: #fff !important;
                color: #000 !important;
                font-family: 'Cairo', sans-serif !important;
                padding: 5mm;
                margin: 0;
            }

            #print-area * {
                color: #000 !important;
            }
        }

        /* PWA Custom Banner */
        .pwa-banner {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(15px);
            border: 2px solid var(--primary);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 999999;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(251, 191, 36, 0.2);
            animation: slideDown 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideDown {
            from {
                top: -100px;
                opacity: 0;
            }

            to {
                top: 20px;
                opacity: 1;
            }
        }

        .pwa-banner-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pwa-banner-logo {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            border: 2px solid var(--primary);
        }

        .pwa-banner-text h4 {
            font-size: 0.95rem;
            color: var(--primary);
            font-weight: 900;
        }

        .pwa-banner-text p {
            font-size: 0.75rem;
            opacity: 0.8;
            margin-top: 3px;
            font-weight: 700;
            line-height: 1.3;
            text-align: right;
        }

        .pwa-banner-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pwa-close-btn {
            background: transparent;
            border: none;
            color: var(--primary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .pwa-close-btn:hover {
            transform: scale(1.2);
        }

        .pwa-install-button {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 900;
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
            transition: 0.2s;
        }

        .pwa-install-button:hover {
            filter: brightness(1.2);
            transform: translateY(-2px);
        }
    </style>
</head>
